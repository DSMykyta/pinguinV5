name: One-time cleanup of obsolete Pinguin branches

on:
  push:
    branches: [work]
    paths:
      - .github/workflows/cleanup-branches-once.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work
        uses: actions/checkout@v4
      - name: Preserve main, reserve, legacy and work; delete obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/cleanup-branches-once.sh
# Final idempotent pass: remove any remaining legacy branch refs.
